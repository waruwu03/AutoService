version: '3.8'

services:
  # 1. Database Service (MySQL)
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-autoservis}
      MYSQL_USER: ${DB_USER:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - autoservis-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache Service
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - autoservis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. MinIO Object Storage (S3 Compatible)
  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${S3_HOST_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    networks:
      - autoservis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Backend Express API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${BACKEND_HOST_PORT:-3002}:${BACKEND_PORT:-3002}"
    environment:
      - NODE_ENV=production
      - PORT=${BACKEND_PORT:-3002}
      - API_PREFIX=${API_PREFIX:-/api/v1}
      - DATABASE_URL=mysql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:3306/${DB_NAME:-autoservis}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - S3_ENDPOINT=minio
      - S3_PORT=9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-autoservis}
      - S3_USE_SSL=false
      - JWT_SECRET=${JWT_SECRET:-your-production-jwt-secret-key-change-me}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your-production-refresh-secret-key-change-me}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Running database migrations...' &&
        npx prisma migrate deploy &&
        echo 'Seeding default accounts...' &&
        npx prisma db seed &&
        echo 'Starting backend server...' &&
        npm start
      "
    networks:
      - autoservis-network

  # 5. Frontend Next.js App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3002/api/v1}
    restart: always
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3002/api/v1}
    depends_on:
      - backend
    networks:
      - autoservis-network

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  autoservis-network:
    driver: bridge
